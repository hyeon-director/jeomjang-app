<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="점장의 새벽">
<meta name="theme-color" content="#080808">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>점장의 새벽</title>
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080808;overscroll-behavior:none}
body{position:fixed;inset:0;color:#f3f3f3;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;letter-spacing:-0.2px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;overflow:hidden;background:#080808}
.hidden{display:none!important}
.tap:active{opacity:.6}
.row:active{background:#161616}
.chip:active{filter:brightness(1.25)}
.scroller{-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.screen{position:absolute;left:0;right:0;top:var(--st);bottom:var(--sb);background:#080808}
.screen-in{animation:screenIn .28s cubic-bezier(.2,.8,.2,1)}
.screen-back{animation:screenBack .28s cubic-bezier(.2,.8,.2,1)}
.msg-in{animation:msgIn .22s ease-out}
.typing-dot{width:7px;height:7px;border-radius:4px;background:#b5b5b5;animation:typingDot 1.1s infinite ease-in-out}
.call-in{animation:callIn .3s ease-out}
.call-ring{animation:callRing 1.8s infinite ease-out}
.call-bounce{animation:callBounce 1.2s infinite ease-in-out}
@keyframes screenIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes screenBack{from{transform:translateX(-24%);opacity:.6}to{transform:translateX(0);opacity:1}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
@keyframes callIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes callRing{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}
@keyframes callBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ib{display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.badge{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums;line-height:1;background:#ff472b;color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;box-sizing:border-box}
/* list rows */
.row{display:flex;align-items:flex-start;width:100%;height:62.8px;padding:7.4px 15px 0 14px;background:transparent;border:0;text-align:left;cursor:pointer;color:#f3f3f3;letter-spacing:-0.2px}
.row .av{width:48px;height:48px;display:block;flex:none}
.row .mid{flex:1;min-width:0;margin-left:10px;padding-top:5.6px;display:flex;flex-direction:column}
.row .nm{display:flex;align-items:center;gap:4px;height:18px;white-space:nowrap}
.row .name{font-size:11px;font-weight:600;line-height:18px;overflow:hidden;text-overflow:ellipsis}
.row .cnt{font-size:11px;color:#a7a7a7;line-height:18px}
.row .pv{margin-top:1.5px;font-size:10px;color:#a7a7a7;line-height:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv.multi{white-space:pre-line}
.row .rt{flex:none;margin-left:8px;padding-top:4.8px;display:flex;flex-direction:column;align-items:flex-end}
.row .tm{font-size:9.5px;color:#a7a7a7;line-height:12px;white-space:nowrap;letter-spacing:-0.1px}
/* chat */
.m-me{display:flex;justify-content:flex-end;align-items:flex-end;gap:6px;padding:0 12px 0 60px}
.m-them{display:flex;align-items:flex-start;padding:0 44px 0 10px}
.m-them .avc{width:50px;flex:none}
.m-them .avc img{width:40px;height:40px;display:block}
.m-them .col{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.m-them .who{font-size:13px;color:#dbdbdb;line-height:17px;margin-bottom:5px}
.m-them .line{display:flex;align-items:flex-end;gap:6px}
.bub{position:relative;max-width:250px;padding:9.5px 13px;font-size:17px;line-height:23px;white-space:pre-wrap;word-break:break-word;border-radius:18px}
.bub.me{background:#fde500;color:#1d1c00}
.bub.them{background:#282828;color:#f3f3f3}
.bub .tail{position:absolute;top:0}
.time{flex:none;font-size:11px;color:#9d9d9d;line-height:13px;padding-bottom:2px;white-space:nowrap}
.msg-input{flex:1;min-width:0;height:100%;background:transparent;border:0;color:#f3f3f3;font-size:16px;font-family:inherit;padding:0 4px;letter-spacing:-0.2px;outline:none}
.msg-input::placeholder{color:#737373}
/* call */
.call{position:absolute;inset:0;z-index:20;overflow:hidden;background:#151515;color:#fff}
.call .bg{position:absolute;left:-60px;top:-60px;width:calc(100% + 120px);height:calc(100% + 120px);object-fit:cover;filter:blur(30px) brightness(.42)}
.call .top{position:relative;padding-top:calc(var(--st) + 85px);display:flex;flex-direction:column;align-items:center}
.call .lbl{font-size:15px;color:rgba(255,255,255,.7)}
.call h2{margin:26px 0 0;font-size:28px;font-weight:700;letter-spacing:-0.5px}
.call .sub{margin-top:10px;font-size:16px;color:rgba(255,255,255,.75)}
.cbtn{width:74px;height:74px;border-radius:37px;border:0;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ccol{display:flex;flex-direction:column;align-items:center;gap:10px}
.ccol span{font-size:15px;color:rgba(255,255,255,.85)}
.ctl{width:66px;height:66px;border-radius:33px;border:0;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ctl.on{background:#fff}
.ctl.on svg{stroke:#151515}
#haptic-sw,#haptic-lb{position:absolute;left:-200px;top:0;width:1px;height:1px;opacity:0;overflow:hidden}
</style>
</head>
<body>
<div id="app">
  <input type="checkbox" switch id="haptic-sw" aria-hidden="true" tabindex="-1">
  <label for="haptic-sw" id="haptic-lb" aria-hidden="true">진동</label>

  <!-- ===== 채팅 목록 ===== -->
  <div id="list" class="screen"></div>

  <!-- ===== 대화방 ===== -->
  <div id="chat" class="screen hidden" style="box-shadow:-8px 0 24px rgba(0,0,0,.5)">
    <div style="position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;padding:0 8px 0 4px">
      <button type="button" class="tap ib" data-act="back" aria-label="뒤로 가기" style="width:44px;height:44px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f3f3f3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12H3.5M10.5 4.5L3 12l7.5 7.5"/></svg>
      </button>
      <h1 style="margin:0 0 0 4px;flex:1;font-size:17px;font-weight:700;letter-spacing:-0.3px;white-space:nowrap">민준(야간)</h1>
      <button type="button" class="tap ib" aria-label="대화 검색" style="width:42px;height:44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f3f3f3" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="M15.8 15.8L21 21"/></svg></button>
      <button type="button" class="tap ib" aria-label="통화" style="width:42px;height:44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f3f3f3" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M5.2 3.5h3.4l1.8 4.6-2.4 1.5a11.5 11.5 0 0 0 6.4 6.4l1.5-2.4 4.6 1.8v3.4c0 .9-.7 1.6-1.6 1.6C10.6 20 4 13.4 3.6 5.1c0-.9.7-1.6 1.6-1.6z"/></svg></button>
      <button type="button" class="tap ib" aria-label="메뉴" style="width:42px;height:44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f3f3f3" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3.5 5.5h17M3.5 12h17M3.5 18.5h17"/></svg></button>
    </div>
    <div id="scroller" class="scroller" style="position:absolute;top:56px;left:0;right:0;bottom:76px;overflow-y:auto">
      <div style="padding:14px 0 18px">
        <div id="msgs"></div>
        <div id="typing" class="hidden"></div>
      </div>
    </div>
    <div id="inputbar" style="position:absolute;left:10px;right:10px;bottom:12px;height:52px;border-radius:26px;background:#1c1c1c;display:flex;align-items:center;padding:0 8px;gap:6px">
      <button type="button" class="tap ib" aria-label="첨부" style="width:36px;height:36px;flex:none;border-radius:18px;background:#2e2e2e"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f3f3f3" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg></button>
      <input id="msg" class="msg-input" type="text" autocomplete="off" autocorrect="off" enterkeyhint="send" placeholder="메시지 입력" aria-label="메시지 입력">
      <button type="button" class="tap ib" aria-label="이모티콘" style="width:36px;height:36px;flex:none;border-radius:18px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e6e6e6" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-8.5-8.5"/><circle cx="9" cy="10.5" r=".9" fill="#e6e6e6"/><circle cx="15" cy="10.5" r=".9" fill="#e6e6e6"/><path d="M8.5 14.5c1.9 2.2 5.1 2.2 7 0"/></svg></button>
      <button type="button" id="sendBtn" class="tap ib hidden" data-act="send" aria-label="전송" style="width:36px;height:36px;flex:none;border-radius:18px;background:#fde500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d1c00" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V4.5M5.5 11L12 4.5l6.5 6.5"/></svg></button>
      <button type="button" id="hashBtn" class="tap ib" aria-label="샵 검색" style="width:36px;height:36px;flex:none;border-radius:18px;background:#2e2e2e"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f3f3f3" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9.5 3.5L7.5 20.5M16.5 3.5l-2 17M4 8.5h17M3 15.5h17"/></svg></button>
    </div>
  </div>

  <!-- ===== 보이스톡 수신 ===== -->
  <div id="ring" class="call call-in hidden">
    <img class="bg" src="assets/av_minjun.png" alt="" aria-hidden="true">
    <div class="top">
      <span class="lbl">보이스톡</span>
      <div style="position:relative;width:124px;height:124px;margin-top:26px">
        <span class="call-ring" style="position:absolute;inset:0;border-radius:48px;border:2px solid rgba(255,255,255,.55)"></span>
        <span class="call-ring" style="position:absolute;inset:0;border-radius:48px;border:2px solid rgba(255,255,255,.55);animation-delay:.9s"></span>
        <img src="assets/av_minjun.png" alt="민준(야간) 프로필" style="position:relative;width:124px;height:124px;display:block">
      </div>
      <h2>민준(야간)</h2>
      <span class="sub">보이스톡 오는 중...</span>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:calc(var(--sb) + 50px);display:flex;justify-content:space-between;padding:0 56px">
      <div class="ccol">
        <button type="button" class="tap cbtn" data-act="decline" aria-label="거절" style="background:#ff3b30"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true" style="transform:rotate(135deg)"><path d="M5.2 3.5h3.4l1.8 4.6-2.4 1.5a11.5 11.5 0 0 0 6.4 6.4l1.5-2.4 4.6 1.8v3.4c0 .9-.7 1.6-1.6 1.6C10.6 20 4 13.4 3.6 5.1c0-.9.7-1.6 1.6-1.6z"/></svg></button>
        <span>거절</span>
      </div>
      <div class="ccol">
        <button type="button" class="tap cbtn call-bounce" data-act="accept" aria-label="수락" style="background:#34c759"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M5.2 3.5h3.4l1.8 4.6-2.4 1.5a11.5 11.5 0 0 0 6.4 6.4l1.5-2.4 4.6 1.8v3.4c0 .9-.7 1.6-1.6 1.6C10.6 20 4 13.4 3.6 5.1c0-.9.7-1.6 1.6-1.6z"/></svg></button>
        <span>수락</span>
      </div>
    </div>
  </div>

  <!-- ===== 보이스톡 통화 중 ===== -->
  <div id="active" class="call hidden">
    <img class="bg" src="assets/av_minjun.png" alt="" aria-hidden="true" style="filter:blur(30px) brightness(.38)">
    <div class="top">
      <span class="lbl">보이스톡</span>
      <img src="assets/av_minjun.png" alt="민준(야간) 프로필" style="margin-top:26px;width:104px;height:104px;display:block">
      <h2 style="margin-top:24px">민준(야간)</h2>
      <span id="callTime" class="sub" style="font-size:18px;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;letter-spacing:.5px">00:00</span>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:calc(var(--sb) + 176px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 40px">
      <div class="ccol"><button type="button" id="spk" class="tap ctl" data-act="speaker" aria-label="스피커" aria-pressed="false"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button><span style="font-size:14px">스피커</span></div>
      <div class="ccol"><button type="button" id="mute" class="tap ctl" data-act="mute" aria-label="음소거" aria-pressed="false"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M4 4l16 16"/></svg></button><span style="font-size:14px">음소거</span></div>
      <div class="ccol"><button type="button" class="tap ctl" aria-label="키패드"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" stroke="none" aria-hidden="true"><circle cx="6" cy="5" r="1.8"/><circle cx="12" cy="5" r="1.8"/><circle cx="18" cy="5" r="1.8"/><circle cx="6" cy="11" r="1.8"/><circle cx="12" cy="11" r="1.8"/><circle cx="18" cy="11" r="1.8"/><circle cx="6" cy="17" r="1.8"/><circle cx="12" cy="17" r="1.8"/><circle cx="18" cy="17" r="1.8"/><circle cx="12" cy="22" r="1.5"/></svg></button><span style="font-size:14px">키패드</span></div>
    </div>
    <div class="ccol" style="position:absolute;left:0;right:0;bottom:calc(var(--sb) + 50px)">
      <button type="button" class="tap cbtn" data-act="end" aria-label="통화 종료" style="background:#ff3b30"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff" aria-hidden="true" style="transform:rotate(135deg)"><path d="M5.2 3.5h3.4l1.8 4.6-2.4 1.5a11.5 11.5 0 0 0 6.4 6.4l1.5-2.4 4.6 1.8v3.4c0 .9-.7 1.6-1.6 1.6C10.6 20 4 13.4 3.6 5.1c0-.9.7-1.6 1.6-1.6z"/></svg></button>
      <span>종료</span>
    </div>
  </div>
</div>

<script>

  var PHONE = '<path d="M5.2 3.5h3.4l1.8 4.6-2.4 1.5a11.5 11.5 0 0 0 6.4 6.4l1.5-2.4 4.6 1.8v3.4c0 .9-.7 1.6-1.6 1.6C10.6 20 4 13.4 3.6 5.1c0-.9.7-1.6 1.6-1.6z"/>';

  // ================= 상태 =================
  var st, timers = {};
  function initialState() {
    return { screen: 'list', unread: 1, chip: 'all', list: [SCRIPT[0]], shown: 1, typing: false, call: null, callSec: 0, muted: false, speaker: false };

  }

    else if (act === 'speaker') { st.speaker = !st.speaker; t.classList.toggle('on', st.speaker); t.setAttribute('aria-pressed', st.speaker); }
  });
  document.addEventListener('touchend', function () { unlockAudio(); }, { passive: true });
  var msg = $('msg');
  msg.addEventListener('input', syncSendBtn);
  msg.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
  });
  // 한글 조합 중 Enter 처리 (조합이 끝난 뒤 전송)
  msg.addEventListener('keyup', function (e) {
    if (e.key === 'Enter' && msg.value.trim() && msg.dataset.composedEnter === '1') { msg.dataset.composedEnter = ''; send(); }
  });
  msg.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) msg.dataset.composedEnter = '1'; });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // ================= 시작 =================
  st = initialState();
  renderList(false);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
